[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-update-lab"
version = "1.0.0"
authors = [{name = "Oleksandr Kuznetsov"}]
license = {file = "LICENSE"}
description = "Reproducible ESP32-S3 experiments on authenticated embedded IDS updates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "cryptography>=41", "pandas>=2", "scikit-learn>=1.3", "pyserial>=3.5"]

[project.optional-dependencies]
flash = ["esptool==4.12.0"]

[project.scripts]
ids-lab = "ids_update_lab.cli:main"

[tool.setuptools.packages.find]
where = ["host"]
